services:

  # ── Qdrant vector store ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - talentrefine-local
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6333/readyz', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Ingest Service ───────────────────────────────────────────────────────────
  ingest-service:
    build:
      context: .
      dockerfile: app/ingest_service/Dockerfile
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      DEV_MODE: ${DEV_MODE:-0}
      QDRANT_URL: http://qdrant:6333
    # En dev se monta el código fuente para que los cambios se reflejen sin rebuild
    volumes:
      - ./app/ingest_service:/app/ingest_service
      - ./app/shared:/app/shared
    # En dev uvicorn arranca con --reload para recarga automática
    command: >
      sh -c "if [ \"$$DEV_MODE\" = '1' ]; then
               uvicorn ingest_service.main:app --host 0.0.0.0 --port 8000 --reload;
             else
               uvicorn ingest_service.main:app --host 0.0.0.0 --port 8000;
             fi"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - talentrefine-local
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Processing Service ───────────────────────────────────────────────────────
  processing-service:
    build:
      context: .
      dockerfile: app/processing_service/Dockerfile
    ports:
      - "8002:8000"
    env_file: .env
    environment:
      DEV_MODE: ${DEV_MODE:-0}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./app/processing_service:/app/processing_service
      - ./app/shared:/app/shared
    command: >
      sh -c "if [ \"$$DEV_MODE\" = '1' ]; then
               uvicorn processing_service.main:app --host 0.0.0.0 --port 8000 --reload;
             else
               uvicorn processing_service.main:app --host 0.0.0.0 --port 8000;
             fi"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - talentrefine-local
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── RAG Service ──────────────────────────────────────────────────────────────
  rag-service:
    build:
      context: .
      dockerfile: app/rag_service/Dockerfile
    ports:
      - "8003:8000"
    env_file: .env
    environment:
      DEV_MODE: ${DEV_MODE:-0}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./app/rag_service:/app/rag_service
      - ./app/shared:/app/shared
    command: >
      sh -c "if [ \"$$DEV_MODE\" = '1' ]; then
               uvicorn rag_service.main:app --host 0.0.0.0 --port 8000 --reload;
             else
               uvicorn rag_service.main:app --host 0.0.0.0 --port 8000;
             fi"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - talentrefine-local
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Streamlit Frontend ───────────────────────────────────────────────────────
  streamlit-frontend:
    build:
      context: ../TalentRefineAI-Frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      INGEST_API_URL: http://ingest-service:8000
      RAG_API_URL: http://rag-service:8000
      USE_MOCK_DATA: ${USE_MOCK_DATA:-true}
    volumes:
      - ../TalentRefineAI-Frontend:/app
      - streamlit_cache:/home/streamlit/.streamlit/cache
    depends_on:
      ingest-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    networks:
      - talentrefine-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  qdrant_data:
  streamlit_cache:

networks:
  talentrefine-local:
    name: talentrefine-local
    driver: bridge
