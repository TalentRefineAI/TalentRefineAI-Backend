[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talentrefine-backend"
version = "0.1.0"
description = "Backend de TalentRefine AI – microservicios FastAPI para ingesta, procesamiento y búsqueda RAG de CVs"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Validación y configuración
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Azure SDK
    "azure-identity>=1.17.0",
    "azure-storage-blob>=12.22.0",
    "azure-keyvault-secrets>=4.8.0",
    "openai>=1.35.0",
    # Vector store
    "qdrant-client>=1.10.0",
    # RAG / LLM orchestration
    "llama-index>=0.11.0",
    "llama-index-vector-stores-qdrant>=0.3.0",
    "llama-index-embeddings-azure-openai>=0.2.0",
    "llama-index-llms-azure-openai>=0.2.0",
    # Procesamiento de PDFs
    "pypdf>=4.3.0",
    # HTTP async
    "httpx>=0.27.0",
    # Logging estructurado
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
